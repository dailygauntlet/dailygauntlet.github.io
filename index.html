<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Gauntlet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f5; --ink:#161a2b; --muted:#5d6480; --panel:#ffffff; --line:#cfd4e4; --accent:#3b3bf0; --on-accent:#fff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12141f; --ink:#eef0fa; --muted:#9aa1bd; --panel:#1c1f30; --line:#343a58; --accent:#8f8fff; --on-accent:#12141f; color-scheme:dark;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 64px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(2.6rem,8vw,4.8rem);font-weight:800;letter-spacing:-.03em;line-height:.95}
.sub{margin:10px 0 0;color:var(--muted);font-size:1.05rem}
.user{display:flex;align-items:center;gap:10px}
.user span{font-weight:700}
button{font:inherit;cursor:pointer}
.btn{border:2px solid var(--ink);background:transparent;color:var(--ink);padding:8px 16px;border-radius:999px;font-weight:700}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:focus-visible,.tab:focus-visible,.tile:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.tabs{display:flex;gap:6px;margin:32px 0 24px;border-bottom:2px solid var(--line)}
.tab{background:none;border:0;color:var(--muted);padding:12px 18px;font-weight:700;font-size:1.05rem;border-bottom:4px solid transparent;margin-bottom:-2px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.count{color:var(--muted);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:116px;padding:14px;border-radius:14px;color:#fff;text-decoration:none;
  background:hsl(var(--h) 62% 36%);font-weight:800;font-size:1.2rem;line-height:1.1;letter-spacing:-.01em;transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.tile .num{position:absolute;top:10px;left:14px;font-size:.85rem;font-weight:700;opacity:.8}
.tile.empty{background:transparent;border:2px dashed var(--line);color:var(--muted);font-weight:500;font-size:1rem;pointer-events:none}
.msg{padding:28px;border:2px dashed var(--line);border-radius:14px;color:var(--muted)}
.hidden{display:none}
dialog{border:0;border-radius:18px;padding:26px;width:min(380px,92vw);background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(10,12,24,.6)}
dialog h2{margin:0 0 6px;font-size:1.6rem}
dialog p{margin:0 0 16px;color:var(--muted);font-size:.95rem}
input{width:100%;font:inherit;padding:11px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-bottom:14px}
.row{display:flex;gap:10px;justify-content:flex-end}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.bar .count{margin:0}
.tile.done{box-shadow:inset 0 0 0 3px #fff}
.tile.done::after{content:"\2713";position:absolute;top:8px;right:10px;width:26px;height:26px;border-radius:50%;background:#fff;color:#17803f;display:grid;place-items:center;font-size:1rem;font-weight:800}
textarea{width:100%;font:inherit;padding:11px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-bottom:10px;resize:vertical}
textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#pasteMsg{min-height:1.4em;margin:0 0 12px;font-weight:700}
#pasteMsg.ok{color:#17803f}
#pasteMsg.bad{color:#c0392b}
@media (prefers-color-scheme:dark){#pasteMsg.ok{color:#5fd08a}#pasteMsg.bad{color:#ff8a7a}}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>The Gauntlet</h1>
      <p class="sub">Run every daily game before the day resets.</p>
    </div>
    <div class="user" id="userArea"></div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-gauntlet" aria-selected="true" aria-controls="panel-gauntlet">The Gauntlet</button>
    <button class="tab" role="tab" id="tab-extra" aria-selected="false" aria-controls="panel-extra">Extra Daily Games</button>
  </div>

  <section id="panel-gauntlet" role="tabpanel" aria-labelledby="tab-gauntlet">
    <div class="bar"><p class="count" id="gauntletCount"></p><button class="btn solid pasteOpen" type="button">Paste result</button></div>
    <div class="grid" id="gauntletGrid"></div>
  </section>

  <section id="panel-extra" role="tabpanel" aria-labelledby="tab-extra" class="hidden">
    <div class="bar"><p class="count">Daily games outside the 100.</p><button class="btn solid pasteOpen" type="button">Paste result</button></div>
    <div class="grid" id="extraGrid"></div>
  </section>
</div>

<dialog id="signInDialog">
  <h2>Sign in</h2>
  <p>Pick a username to sign in on this device.</p>
  <input id="usernameInput" type="text" maxlength="24" placeholder="Username" autocomplete="username">
  <div class="row">
    <button class="btn" id="cancelSignIn" type="button">Cancel</button>
    <button class="btn solid" id="confirmSignIn" type="button">Sign in</button>
  </div>
</dialog>

<dialog id="pasteDialog">
  <h2>Paste your result</h2>
  <p>Press Share in the game, then paste what it copied. Solved games get a checkmark for today.</p>
  <textarea id="pasteText" rows="6" placeholder="Wordle 1,234 3/6"></textarea>
  <p id="pasteMsg" role="status"></p>
  <div class="row">
    <button class="btn" id="closePaste" type="button">Close</button>
    <button class="btn solid" id="checkPaste" type="button">Check result</button>
  </div>
</dialog>

const EXTRA_GAMES = [
  // { name: "Game Name", link: "https://example.com" },

// PASTE-RESULT RULES (optional).
// A pasted result is matched to a game by the game's name in its first two lines.
// It counts as solved unless the text shows a miss (like "X/6" or "failed").
// For a game that needs special handling, add a rule whose key is the exact game name:
//   "Game Name": { match: /text that identifies the game/i, solved: /text that proves a win/i },
// "solved" can also be a function: solved: text => true or false
// DATE CHECK: a result is rejected if it shows a date that is not today. For games that only print a
// puzzle number, add num (a regex whose first group is the number) and start: [a known puzzle number,
// "YYYY-MM-DD" of that puzzle]. Add utc: true for games that reset at midnight GMT instead of local time.
// MINIMUM SCORE: minScore: 300 gives a checkmark only if the result's score is at least 300. The score is the
// biggest number written next to "pts", "points" or "score". If a game words it differently, add score: /regex/
// (its first group is the number).
const SHARE_RULES = {
  "Wordle": {
    match: /Wordle\s+[\d,]+\s+[1-6X]\/6/i, solved: /Wordle\s+[\d,]+\s+[1-6]\/6/i,
    num: /Wordle\s+([\d,]+)/i, start: [0, "2021-06-19"],
  },
  "Nerdle": {
    match: /nerdlegame\s+\d+\s+[1-6X]\/6/i, solved: /nerdlegame\s+\d+\s+[1-6]\/6/i,
    num: /nerdlegame\s+(\d+)/i, start: [1108, "2025-01-31"], utc: true,
  },
  "Strands": { match: /Strands\s*#\d+/i, num: /Strands\s*#(\d+)/i, start: [1, "2024-03-04"] },
  // Krillion shares look like: "Krillion #96 🦐" then the score alone on the next line.
  "Krillion": { match: /Krillion/i, minScore: 300, score: /Krillion\s*#\d+[^\n]*\n\s*(\d[\d,]*)/i },
  "Connections": {
    match: /Connections\s+Puzzle\s*#?\d+/i,
    num: /Puzzle\s*#?([\d,]+)/i, start: [1, "2023-06-12"],
    solved: t => t.split(/\r?\n/).filter(l => /^(?:🟨{4}|🟩{4}|🟦{4}|🟪{4})$/u.test(l.trim())).length >= 4,
  },
};
const MISS = /\bX\/\d+|\bfailed\b|\bgave up\b|\bdid not (?:solve|finish)\b|❌/i;

/* ===================================================================== */

function renderTiles(container, games, slots) {
  container.innerHTML = "";
  const total = slots ? Math.max(slots, games.length) : games.length;
  for (let i = 0; i < total; i++) {
    const g = games[i];
    const hasGame = g && g.name && g.link;
    const el = document.createElement(hasGame ? "a" : "div");
    const done = hasGame && isDone(g.name);
    el.className = "tile" + (hasGame ? "" : " empty") + (done ? " done" : "");
    if (done) el.setAttribute("aria-label", g.name + " (done today)");
    el.style.setProperty("--h", Math.round((i * 137.5) % 360));
    if (slots) {
      const num = document.createElement("span");
      num.className = "num";
      num.textContent = i + 1;
      el.appendChild(num);
    }
    const label = document.createElement("span");
    label.textContent = hasGame ? g.name : "Empty slot";
    el.appendChild(label);
    if (hasGame) {
      el.href = g.link;
      el.target = "_blank";
      el.rel = "noopener noreferrer";
    }
    container.appendChild(el);
  }
}

function renderAll() {
  renderTiles(document.getElementById("gauntletGrid"), GAUNTLET_GAMES, GAUNTLET_SLOTS);
  const filled = GAUNTLET_GAMES.filter(g => g.name && g.link).length;
  const doneToday = GAUNTLET_GAMES.filter(g => g.name && g.link && isDone(g.name)).length;
  document.getElementById("gauntletCount").textContent = getUser()
    ? doneToday + " of " + GAUNTLET_SLOTS + " done today"
    : filled + " of " + GAUNTLET_SLOTS + " games added";

  const extraGrid = document.getElementById("extraGrid");
  if (EXTRA_GAMES.filter(g => g.name && g.link).length) {
    extraGrid.className = "grid";
    renderTiles(extraGrid, EXTRA_GAMES, 0);
  } else {
    extraGrid.className = "msg";
    extraGrid.textContent = "No extra daily games yet. Add them to EXTRA_GAMES in the code.";
  }
}

/* ---------- Tabs ---------- */
const tabs = { gauntlet: ["tab-gauntlet", "panel-gauntlet"], extra: ["tab-extra", "panel-extra"] };
function showTab(key) {
  for (const k in tabs) {
    const on = k === key;
    document.getElementById(tabs[k][0]).setAttribute("aria-selected", on);
    document.getElementById(tabs[k][1]).classList.toggle("hidden", !on);
  }
}
document.getElementById("tab-gauntlet").onclick = () => showTab("gauntlet");
document.getElementById("tab-extra").onclick = () => showTab("extra");

/* ---------- Sign in (saved in this browser only) ---------- */
const dialog = document.getElementById("signInDialog");
const input = document.getElementById("usernameInput");
const userArea = document.getElementById("userArea");

function getUser() { try { return localStorage.getItem("gauntlet-user"); } catch (e) { return null; } }
function setUser(name) {
  try { name ? localStorage.setItem("gauntlet-user", name) : localStorage.removeItem("gauntlet-user"); } catch (e) {}
}

function renderUser() {
  renderAll();
  const user = getUser();
  userArea.innerHTML = "";
  if (user) {
    const who = document.createElement("span");
    who.textContent = user;
    const out = document.createElement("button");
    out.className = "btn";
    out.textContent = "Sign out";
    out.onclick = () => { setUser(null); renderUser(); };
    userArea.append(who, out);
  } else {
    const inBtn = document.createElement("button");
    inBtn.className = "btn solid";
    inBtn.textContent = "Sign in";
    inBtn.onclick = () => { input.value = ""; dialog.showModal(); input.focus(); };
    userArea.append(inBtn);
  }
}

function confirmSignIn() {
  const name = input.value.trim();
  if (!name) { input.focus(); return; }
  setUser(name);
  dialog.close();
  renderUser();
}
document.getElementById("confirmSignIn").onclick = confirmSignIn;
document.getElementById("cancelSignIn").onclick = () => dialog.close();
input.addEventListener("keydown", e => { if (e.key === "Enter") confirmSignIn(); });
renderUser();

/* ---------- Checkmarks: saved per username per day, reset at local midnight ---------- */
function today() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function doneKey() { return "gauntlet-done:" + getUser() + ":" + today(); }
function getDone() { try { return JSON.parse(localStorage.getItem(doneKey()) || "[]"); } catch (e) { return []; } }
function isDone(name) { return !!getUser() && getDone().includes(name); }
function markDone(name) {
  const list = getDone();
  if (!list.includes(name)) list.push(name);
  try { localStorage.setItem(doneKey(), JSON.stringify(list)); } catch (e) {}
}

/* ---------- Paste a result ---------- */
function norm(s) { return s.toLowerCase().replace(/[^a-z0-9]/g, ""); }

/* ---------- Date check ---------- */
const MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
function dayNum(y, m, d) { return Math.round(Date.UTC(y, m - 1, d) / 86400000); }
function todayNum(utc) {
  const d = new Date();
  return utc ? dayNum(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate())
             : dayNum(d.getFullYear(), d.getMonth() + 1, d.getDate());
}
// Finds dates written in the result, like 2026-10-19, 19.10.2026, 10/19/2026, Oct 19, 2026 or 19 Oct 2026.
function datesIn(text) {
  const out = [];
  const add = (y, mo, d) => { if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31) out.push(dayNum(+y, +mo, +d)); };
  const each = (re, fn) => { let m; while ((m = re.exec(text))) fn(m); };
  const mon = "(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\\.?";
  each(/\b(\d{4})-(\d{2})-(\d{2})\b/g, m => add(m[1], m[2], m[3]));
  each(/\b(\d{1,2})\.(\d{1,2})\.(\d{4})\b/g, m => add(m[3], m[2], m[1]));
  each(/\b(\d{1,2})\/(\d{1,2})\/(\d{4})\b/g, m => add(m[3], m[1], m[2]));
  each(new RegExp("\\b" + mon + "\\s+(\\d{1,2})(?:st|nd|rd|th)?,?\\s+(\\d{4})\\b", "gi"), m => add(m[3], MONTHS.indexOf(m[1].toLowerCase()) + 1, m[2]));
  each(new RegExp("\\b(\\d{1,2})(?:st|nd|rd|th)?\\s+" + mon + ",?\\s+(\\d{4})\\b", "gi"), m => add(m[3], MONTHS.indexOf(m[2].toLowerCase()) + 1, m[1]));
  return out;
}
// Returns a message if the result is from another day, or "" if it is fine (or has no date to check).
function staleReason(game, text) {
  const rule = SHARE_RULES[game.name];
  if (rule && rule.num && rule.start) {
    const m = text.match(rule.num);
    if (m) {
      const n = parseInt(m[1].replace(/,/g, ""), 10);
      const [y, mo, d] = rule.start[1].split("-").map(Number);
      const want = rule.start[0] + todayNum(rule.utc) - dayNum(y, mo, d);
      if (n !== want) return game.name + " #" + n + " is not today's puzzle. Today is #" + want + ".";
    }
  }
  const dates = datesIn(text);
  if (dates.length && !dates.includes(todayNum(false))) return "That " + game.name + " result is from a different day.";
  return "";
}

// Finds the score in a result: the biggest match of your own regex, or the biggest number next to "pts", "points" or "score".
function scoreIn(text, re) {
  const pats = re ? [new RegExp(re.source, "gi")]
    : [/(\d[\d,]*)\s*(?:pts?|points?)\b/gi, /\b(?:score|points|total)\b\D{0,12}(\d[\d,]*)/gi];
  for (const p of pats) {
    const nums = [...text.matchAll(p)].map(m => parseInt(m[1].replace(/,/g, ""), 10));
    if (nums.length) return Math.max(...nums);
  }
  return null;
}

function checkResult(text) {
  const clean = text.trim();
  if (!clean) return { error: "Paste a result first." };
  const games = GAUNTLET_GAMES.concat(EXTRA_GAMES).filter(g => g.name && g.link);
  let game = games.find(g => SHARE_RULES[g.name] && SHARE_RULES[g.name].match.test(clean));
  if (!game) {
    const head = norm(clean.split(/\r?\n/).filter(l => l.trim()).slice(0, 2).join(" "));
    game = games.slice().sort((a, b) => norm(b.name).length - norm(a.name).length)
      .find(g => head.includes(norm(g.name)));
  }
  if (!game) return { error: "Could not tell which game that is. Make sure the game name is in the result." };
  const rule = SHARE_RULES[game.name];
  let solved = !MISS.test(clean);
  if (rule && rule.solved) solved = typeof rule.solved === "function" ? rule.solved(clean) : rule.solved.test(clean);
  let why = "";
  if (rule && rule.minScore != null) {
    const pts = scoreIn(clean, rule.score);
    if (pts === null) return { error: "Could not find the " + game.name + " score in that result." };
    solved = pts >= rule.minScore;
    why = game.name + " scored " + pts + ", but needs " + rule.minScore + " for a checkmark.";
  }
  return { game, solved, why, stale: staleReason(game, clean) };
}

const pasteDialog = document.getElementById("pasteDialog");
const pasteText = document.getElementById("pasteText");
const pasteMsg = document.getElementById("pasteMsg");
function say(text, ok) { pasteMsg.textContent = text; pasteMsg.className = ok ? "ok" : "bad"; }

document.querySelectorAll(".pasteOpen").forEach(b => b.onclick = () => {
  pasteText.value = ""; say("", true);
  pasteDialog.showModal(); pasteText.focus();
});
document.getElementById("closePaste").onclick = () => pasteDialog.close();
document.getElementById("checkPaste").onclick = () => {
  if (!getUser()) { say("Sign in first so your checkmarks are saved.", false); return; }
  const r = checkResult(pasteText.value);
  if (r.error) { say(r.error, false); return; }
  if (r.stale) { say(r.stale, false); return; }
  if (!r.solved) { say(r.why || (r.game.name + " looks like a miss, so no checkmark."), false); return; }
  markDone(r.game.name);
  renderAll();
  pasteText.value = "";
  say(r.game.name + " is checked off.", true);
};

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Gauntlet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f5; --ink:#161a2b; --muted:#5d6480; --panel:#ffffff; --line:#cfd4e4; --accent:#3b3bf0; --on-accent:#fff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12141f; --ink:#eef0fa; --muted:#9aa1bd; --panel:#1c1f30; --line:#343a58; --accent:#8f8fff; --on-accent:#12141f; color-scheme:dark;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 64px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(2.6rem,8vw,4.8rem);font-weight:800;letter-spacing:-.03em;line-height:.95}
.sub{margin:10px 0 0;color:var(--muted);font-size:1.05rem}
.user{display:flex;align-items:center;gap:10px}
.user span{font-weight:700}
button{font:inherit;cursor:pointer}
.btn{border:2px solid var(--ink);background:transparent;color:var(--ink);padding:8px 16px;border-radius:999px;font-weight:700}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:focus-visible,.tab:focus-visible,.tile:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.tabs{display:flex;gap:6px;margin:32px 0 24px;border-bottom:2px solid var(--line)}
.tab{background:none;border:0;color:var(--muted);padding:12px 18px;font-weight:700;font-size:1.05rem;border-bottom:4px solid transparent;margin-bottom:-2px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.count{color:var(--muted);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:116px;padding:14px;border-radius:14px;color:#fff;text-decoration:none;
  background:hsl(var(--h) 62% 36%);font-weight:800;font-size:1.2rem;line-height:1.1;letter-spacing:-.01em;transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.tile .num{position:absolute;top:10px;left:14px;font-size:.85rem;font-weight:700;opacity:.8}
.tile.empty{background:transparent;border:2px dashed var(--line);color:var(--muted);font-weight:500;font-size:1rem;pointer-events:none}
.msg{padding:28px;border:2px dashed var(--line);border-radius:14px;color:var(--muted)}
.hidden{display:none}
dialog{border:0;border-radius:18px;padding:26px;width:min(380px,92vw);background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(10,12,24,.6)}
dialog h2{margin:0 0 6px;font-size:1.6rem}
dialog p{margin:0 0 16px;color:var(--muted);font-size:.95rem}
input{width:100%;font:inherit;padding:11px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-bottom:14px}
.row{display:flex;gap:10px;justify-content:flex-end}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.bar .count{margin:0}
.tile.done{box-shadow:inset 0 0 0 3px #fff}
.tile.done::after{content:"\2713";position:absolute;top:8px;right:10px;width:26px;height:26px;border-radius:50%;background:#fff;color:#17803f;display:grid;place-items:center;font-size:1rem;font-weight:800}
textarea{width:100%;font:inherit;padding:11px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-bottom:10px;resize:vertical}
textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#authMsg{min-height:1.4em;margin:0 0 12px;font-weight:700}
#authMsg.ok{color:#17803f}
#authMsg.bad{color:#c0392b}
@media (prefers-color-scheme:dark){#authMsg.ok{color:#5fd08a}#authMsg.bad{color:#ff8a7a}}
.board{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.board li{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:12px;padding:12px 16px;border:2px solid var(--line);border-radius:12px;background:var(--panel)}
.board li.me{border-color:var(--accent)}
.board .place{font-weight:800;font-size:1.2rem}
.board .name{font-weight:700;overflow-wrap:anywhere}
.board .games{font-weight:800}
#pasteMsg{min-height:1.4em;margin:0 0 12px;font-weight:700}
#pasteMsg.ok{color:#17803f}
#pasteMsg.bad{color:#c0392b}
@media (prefers-color-scheme:dark){#pasteMsg.ok{color:#5fd08a}#pasteMsg.bad{color:#ff8a7a}}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>The Gauntlet</h1>
      <p class="sub">Run every daily game before the day resets.</p>
    </div>
    <div class="user" id="userArea"></div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-gauntlet" aria-selected="true" aria-controls="panel-gauntlet">The Gauntlet</button>
    <button class="tab" role="tab" id="tab-extra" aria-selected="false" aria-controls="panel-extra">Extra Daily Games</button>
    <button class="tab" role="tab" id="tab-board" aria-selected="false" aria-controls="panel-board">Leaderboard</button>
  </div>

  <section id="panel-gauntlet" role="tabpanel" aria-labelledby="tab-gauntlet">
    <div class="bar"><p class="count" id="gauntletCount"></p><button class="btn solid pasteOpen" type="button">Paste result</button></div>
    <div class="grid" id="gauntletGrid"></div>
  </section>

  <section id="panel-extra" role="tabpanel" aria-labelledby="tab-extra" class="hidden">
    <div class="bar"><p class="count">Daily games outside the 100.</p><button class="btn solid pasteOpen" type="button">Paste result</button></div>
    <div class="grid" id="extraGrid"></div>
  </section>

  <section id="panel-board" role="tabpanel" aria-labelledby="tab-board" class="hidden">
    <div class="bar"><p class="count" id="boardDay"></p><button class="btn" id="boardRefresh" type="button">Refresh</button></div>
    <div id="boardList"></div>
  </section>
</div>

<dialog id="signInDialog">
  <h2>Sign in</h2>
  <p>Use your email and a password. New here? Pick a username and press Create account.</p>
  <input id="usernameInput" type="text" maxlength="24" placeholder="Username (new accounts only)" autocomplete="nickname">
  <input id="emailInput" type="email" placeholder="Email" autocomplete="email">
  <input id="passwordInput" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
  <p id="authMsg" role="status"></p>
  <div class="row">
    <button class="btn" id="cancelSignIn" type="button">Cancel</button>
    <button class="btn" id="signUpBtn" type="button">Create account</button>
    <button class="btn solid" id="signInBtn" type="button">Sign in</button>
  </div>
</dialog>

<dialog id="pasteDialog">
  <h2>Paste your result</h2>
  <p>Press Share in the game, then paste what it copied. Solved games get a checkmark for today.</p>
  <textarea id="pasteText" rows="6" placeholder="Wordle 1,234 3/6"></textarea>
  <p id="pasteMsg" role="status"></p>
  <div class="row">
    <button class="btn" id="closePaste" type="button">Close</button>
    <button class="btn solid" id="checkPaste" type="button">Check result</button>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

// Extra Daily Games tab (no limit, add as many as you like).
const EXTRA_GAMES = [
  // { name: "Warmle", link: "https://warmle.org/" },
{ name: "Floored", link: "https://playfloored.com/" },
{ name: "Extraplot", link: "https://guessdash.com/extraplot?ref=wordleverse.net" },

// Paste-result rules (SHARE_RULES) now live on the server. See supabase/submit_result.ts.

/* ===================================================================== */

function renderTiles(container, games, slots) {
  container.innerHTML = "";
  const total = slots ? Math.max(slots, games.length) : games.length;
  for (let i = 0; i < total; i++) {
    const g = games[i];
    const hasGame = g && g.name && g.link;
    const el = document.createElement(hasGame ? "a" : "div");
    const done = hasGame && isDone(g.name);
    el.className = "tile" + (hasGame ? "" : " empty") + (done ? " done" : "");
    if (done) el.setAttribute("aria-label", g.name + " (done today)");
    el.style.setProperty("--h", Math.round((i * 137.5) % 360));
    if (slots) {
      const num = document.createElement("span");
      num.className = "num";
      num.textContent = i + 1;
      el.appendChild(num);
    }
    const label = document.createElement("span");
    label.textContent = hasGame ? g.name : "Empty slot";
    el.appendChild(label);
    if (hasGame) {
      el.href = g.link;
      el.target = "_blank";
      el.rel = "noopener noreferrer";
      el.addEventListener("click", () => logClick(g.name));
    }
    container.appendChild(el);
  }
}

function renderAll() {
  renderTiles(document.getElementById("gauntletGrid"), GAUNTLET_GAMES, GAUNTLET_SLOTS);
  const filled = GAUNTLET_GAMES.filter(g => g.name && g.link).length;
  const doneToday = GAUNTLET_GAMES.filter(g => g.name && g.link && isDone(g.name)).length;
  document.getElementById("gauntletCount").textContent = getUser()
    ? doneToday + " of " + GAUNTLET_SLOTS + " done today"
    : filled + " of " + GAUNTLET_SLOTS + " games added";

  const extraGrid = document.getElementById("extraGrid");
  if (EXTRA_GAMES.filter(g => g.name && g.link).length) {
    extraGrid.className = "grid";
    renderTiles(extraGrid, EXTRA_GAMES, 0);
  } else {
    extraGrid.className = "msg";
    extraGrid.textContent = "No extra daily games yet. Add them to EXTRA_GAMES in the code.";
  }
}

/* ---------- Tabs ---------- */
const tabs = { gauntlet: ["tab-gauntlet", "panel-gauntlet"], extra: ["tab-extra", "panel-extra"], board: ["tab-board", "panel-board"] };
function showTab(key) {
  for (const k in tabs) {
    const on = k === key;
    document.getElementById(tabs[k][0]).setAttribute("aria-selected", on);
    document.getElementById(tabs[k][1]).classList.toggle("hidden", !on);
  }
}
document.getElementById("tab-gauntlet").onclick = () => showTab("gauntlet");
document.getElementById("tab-extra").onclick = () => showTab("extra");
document.getElementById("tab-board").onclick = () => { showTab("board"); loadBoard(); };

/* ---------- Accounts (Supabase) ---------- */
const sb = (typeof supabase !== "undefined" && !SUPABASE_URL.startsWith("PASTE"))
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
let currentUser = null;
let doneSet = new Set();

function getUser() { return currentUser; }
function isDone(name) { return !!currentUser && doneSet.has(name); }
function localDate() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
// Tells the server you opened a game. The server stamps the time.
function logClick(name) { if (sb && currentUser) sb.rpc("log_click", { game_name: name }).then(() => {}); }

// Checkmarks come from the database, never from the browser.
async function loadDone() {
  doneSet = new Set();
  if (sb && currentUser) {
    const { data } = await sb.from("results").select("game").eq("day", localDate());
    (data || []).forEach(r => doneSet.add(r.game));
  }
  renderAll();
}

const authDialog = document.getElementById("signInDialog");
const usernameInput = document.getElementById("usernameInput");
const emailInput = document.getElementById("emailInput");
const passwordInput = document.getElementById("passwordInput");
const authMsg = document.getElementById("authMsg");
const userArea = document.getElementById("userArea");
function authSay(text, ok) { authMsg.textContent = text; authMsg.className = ok ? "ok" : "bad"; }

function renderUser() {
  renderAll();
  userArea.innerHTML = "";
  if (currentUser) {
    const who = document.createElement("span");
    who.textContent = (currentUser.user_metadata && currentUser.user_metadata.username) || currentUser.email;
    const out = document.createElement("button");
    out.className = "btn";
    out.textContent = "Sign out";
    out.onclick = () => sb.auth.signOut();
    userArea.append(who, out);
  } else {
    const inBtn = document.createElement("button");
    inBtn.className = "btn solid";
    inBtn.textContent = "Sign in";
    inBtn.onclick = () => { authSay("", true); authDialog.showModal(); emailInput.focus(); };
    userArea.append(inBtn);
  }
}

async function doAuth(signUp) {
  const email = emailInput.value.trim(), password = passwordInput.value, username = usernameInput.value.trim();
  if (!sb) return authSay("Accounts are not set up yet. Add your Supabase details in the code.", false);
  if (!email || password.length < 6) return authSay("Enter your email and a password of 6+ characters.", false);
  if (signUp && !username) return authSay("Pick a username for your new account.", false);
  authSay("One moment...", true);
  const res = signUp
    ? await sb.auth.signUp({ email, password, options: { data: { username } } })
    : await sb.auth.signInWithPassword({ email, password });
  if (res.error) return authSay(res.error.message, false);
  if (signUp && !res.data.session) return authSay("Check your email to confirm your account, then sign in.", true);
  authDialog.close();
}
document.getElementById("signUpBtn").onclick = () => doAuth(true);
document.getElementById("signInBtn").onclick = () => doAuth(false);
document.getElementById("cancelSignIn").onclick = () => authDialog.close();
passwordInput.addEventListener("keydown", e => { if (e.key === "Enter") doAuth(false); });

if (sb) {
  sb.auth.onAuthStateChange((_event, session) => {
    currentUser = session ? session.user : null;
    renderUser();
    setTimeout(loadDone, 0);
  });
} else {
  renderUser();
}

/* ---------- Leaderboard: most Gauntlet games completed today ---------- */
// Usernames are added as plain text so nobody can sneak code in through a username.
async function loadBoard() {
  const list = document.getElementById("boardList"), note = document.getElementById("boardDay");
  list.innerHTML = "";
  if (!sb || !currentUser) { note.textContent = "Sign in to see the leaderboard."; return; }
  note.textContent = "Loading...";
  const { data, error } = await sb.rpc("leaderboard", { for_day: localDate() });
  if (error) { note.textContent = "Could not load the leaderboard."; return; }
  note.textContent = data.length ? "Most Gauntlet games completed today" : "No one has checked off a game yet today.";
  const ol = document.createElement("ol");
  ol.className = "board";
  data.forEach(row => {
    const li = document.createElement("li");
    if (row.is_me) li.className = "me";
    const place = document.createElement("span");
    place.className = "place";
    place.textContent = "#" + row.place;
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = row.username + (row.is_me ? " (you)" : "");
    const games = document.createElement("span");
    games.className = "games";
    games.textContent = row.games + " / " + GAUNTLET_SLOTS;
    li.append(place, name, games);
    ol.appendChild(li);
  });
  list.appendChild(ol);
}
document.getElementById("boardRefresh").onclick = loadBoard;

/* ---------- Paste a result (checked on the server) ---------- */
const pasteDialog = document.getElementById("pasteDialog");
const pasteText = document.getElementById("pasteText");
const pasteMsg = document.getElementById("pasteMsg");
function say(text, ok) { pasteMsg.textContent = text; pasteMsg.className = ok ? "ok" : "bad"; }

document.querySelectorAll(".pasteOpen").forEach(b => b.onclick = () => {
  pasteText.value = ""; say("", true);
  pasteDialog.showModal(); pasteText.focus();
});
document.getElementById("closePaste").onclick = () => pasteDialog.close();
document.getElementById("checkPaste").onclick = async () => {
  if (!currentUser) { say("Sign in first so your checkmarks are saved.", false); return; }
  if (!pasteText.value.trim()) { say("Paste a result first.", false); return; }
  say("Checking...", true);
  const { data, error } = await sb.functions.invoke("submit_result", { body: { text: pasteText.value, localDate: localDate() } });
  if (error || !data) { say("Could not reach the server. Try again.", false); return; }
  say(data.message, data.ok);
  if (data.ok) { pasteText.value = ""; loadDone(); }
};


</script>
